name: Publish protobuf-serializer

# Builds the one patched module and publishes it to this repository's GitHub Packages
# Maven registry. Nothing else in the reactor is built: the 8.3.1 siblings
# (kafka-protobuf-provider, kafka-schema-serializer, kafka-schema-registry-client, ...)
# resolve as published artifacts from packages.confluent.io, which is why there is no -am
# here and no need to build `common` or `rest-utils` from source.
#
# See ALPIAN.md for the branch model and how to rebase onto a newer upstream tag.

on:
  push:
    branches: [ 'alpian/main' ]
    paths:
      - 'protobuf-serializer/**'
      - '.github/workflows/publish-protobuf-serializer.yml'
  pull_request:
    paths:
      - 'protobuf-serializer/**'
      - '.github/workflows/publish-protobuf-serializer.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the version to publish (default: the one in protobuf-serializer/pom.xml)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # One publish at a time per branch; a queued run would race for the same coordinates.
  group: publish-protobuf-serializer-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE: protobuf-serializer
  # The upstream tag this branch is based on. Kept in step with .alpian-base so a drifting
  # rebase is visible in the build log rather than only in the version string.
  MAVEN_ARGS: >-
    -B -ntp
    -Dspotless.check.skip=true
    -Dcheckstyle.skip=true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # Matches the JDK this was verified on. The module targets Java 11 bytecode, so 17
          # or 21 should work too -- this is the version that is actually known to build green.
          java-version: '25'
          distribution: temurin
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> whose id matches the repository the
          # deploy step targets, reading the two env vars set on that step.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Confirm the branch is based on the tag it claims
        # Three things must agree, or the published artifact's name misstates what it was built
        # from. The reactor version is the ground truth: it comes from the upstream tag the
        # branch was rebased onto, and cannot be forgotten the way the other two can.
        run: |
          base="$(cat .alpian-base)"
          upstream="$(mvn $MAVEN_ARGS -q -DforceStdout \
            -Dexpression=project.version --non-recursive help:evaluate)"
          module="$(mvn $MAVEN_ARGS -pl "$MODULE" -q -DforceStdout \
            -Dexpression=project.version help:evaluate)"
          echo ".alpian-base:     $base"
          echo "upstream reactor: $upstream"
          echo "module version:   $module"
          if [ "${base#v}" != "$upstream" ]; then
            echo "::error::.alpian-base says ${base#v} but the tree is upstream $upstream." \
                 "Rebased onto a new tag without updating .alpian-base?"
            exit 1
          fi
          case "$module" in
            "$upstream"-*) echo "OK: all three agree on $upstream" ;;
            *) echo "::error::Module version '$module' is not derived from $upstream." \
                    "Restamp <version> in $MODULE/pom.xml to ${upstream}-alpian-N."
               exit 1 ;;
          esac

      - name: Override version
        if: inputs.version != ''
        run: |
          mvn $MAVEN_ARGS -pl "$MODULE" versions:set \
            -DnewVersion='${{ inputs.version }}' -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn $MAVEN_ARGS -pl "$MODULE" verify

      - name: Publish to GitHub Packages
        # Only from the branch itself; pull requests build and test but must not publish.
        if: github.event_name != 'pull_request'
        run: |
          mvn $MAVEN_ARGS -pl "$MODULE" -DskipTests deploy \
            -DaltDeploymentRepository="github::https://maven.pkg.github.com/${{ github.repository }}"
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarise
        if: always()
        run: |
          {
            echo "### protobuf-serializer"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| upstream base | \`$(cat .alpian-base)\` |"
            echo "| artifact | \`$(ls $MODULE/target/*.jar 2>/dev/null | grep -v -e sources -e javadoc -e tests | head -1 | xargs -r basename)\` |"
            echo "| published to | \`https://maven.pkg.github.com/${{ github.repository }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protobuf-serializer-jars
          path: protobuf-serializer/target/*.jar
          if-no-files-found: warn
